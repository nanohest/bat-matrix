# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow generates SLSA provenance file for a release.
# The generation satisfies level 3 for the provenance requirements - see https://slsa.dev/spec/v0.1/requirements
# The project is an initiative of the OpenSSF (openssf.org) and is developed at
# https://github.com/slsa-framework/slsa-github-generator.
# The provenance file can be verified using https://github.com/slsa-framework/slsa-verifier.
# For more information about SLSA and how it improves the supply-chain, visit slsa.dev.

name: SLSA generic generator
on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # To upload the binary to the release.
    outputs:
      digests: ${{ steps.hash.outputs.hashes }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      # ========================================================
      #
      # Step 1: Build artifact.
      #
      # ========================================================
      - name: Build artifacts
        run: |
            cargo build --release
            mkdir -p dist
            cp target/release/bat-matrix dist/bat-matrix-x86_64-linux

      # ========================================================
      #
      # Step 2: Generate provenance subjects.
      #         Update sha256 sum arguments to include all
      #         all binaries that provenance is generated for
      #
      # ========================================================
      - name: Generate subject for provenance
        id: hash
        working-directory: dist
        run: |
          set -euo pipefail

          # List the artifacts the provenance will refer to.
          files=$(ls bat-matrix-x86_64-linux)
          # Generate the subjects (base64 encoded).
          echo "hashes=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"

      # ========================================================
      #
      # Step 3: Upload the binary to the GitHub release.
      #
      # ========================================================
      - name: Upload binary to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG_NAME" dist/bat-matrix-x86_64-linux \
            --repo "$GITHUB_REPOSITORY" --clobber

  provenance:
    needs: [build]
    permissions:
      actions: read   # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true # Optional: Upload to a new release
